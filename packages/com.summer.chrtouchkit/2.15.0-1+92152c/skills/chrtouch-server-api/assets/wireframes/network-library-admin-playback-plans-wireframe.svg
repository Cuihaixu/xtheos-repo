<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>
    .bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#d9dde3;stroke-width:1}.soft{fill:#f1f3f5}.dark{fill:#20252b}.line{stroke:#e2e5e9;stroke-width:1}.blue{fill:#2468f2}.red{fill:#d94141}.txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#20252b}.muted{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#707780}.white{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#fff}.title{font-size:22px;font-weight:700}.h{font-size:16px;font-weight:600}.body{font-size:14px}.sub{font-size:12px}.cap{font-size:11px}.mono{font-family:Menlo,monospace;font-size:11px;fill:#707780}</style></defs>
  <rect width="1440" height="900" class="bg"/>
  <rect x="0" y="0" width="1440" height="58" class="dark"/><text x="28" y="36" class="white h">Touch Kit 管理后台</text><text x="170" y="36" class="white body">网络库 / 抖音常用手势 / 浏览 / 上滑</text>
  <rect x="18" y="76" width="278" height="806" rx="8" class="panel"/><text x="40" y="110" class="txt h">网络库</text>
  <rect x="34" y="126" width="246" height="36" rx="6" class="soft"/><text x="50" y="149" class="txt body">▾ 抖音常用手势</text><text x="64" y="190" class="muted body">▾ 浏览</text><text x="86" y="224" class="txt body">▣ 上滑</text><rect x="80" y="238" width="184" height="34" rx="6" fill="#e8f0ff"/><text x="98" y="260" class="blue body">回放计划  ·  3</text><text x="86" y="310" class="muted body">▣ 下滑</text><text x="64" y="350" class="muted body">▸ 评论</text>
  <rect x="314" y="76" width="1108" height="806" rx="8" class="panel"/>
  <text x="344" y="114" class="txt title">上滑 · 回放计划</text><text x="344" y="140" class="muted body">记录组 · 8 条手势 · 单一类型 · 修改会同步到所有设备镜像</text>
  <rect x="1244" y="96" width="146" height="38" rx="6" class="blue"/><text x="1317" y="120" text-anchor="middle" class="white body">+ 创建回放计划</text>
  <line x1="344" y1="162" x2="1390" y2="162" class="line"/>
  <rect x="344" y="184" width="1046" height="46" class="soft"/><text x="366" y="213" class="muted sub">名称 / Alias</text><text x="655" y="213" class="muted sub">选择与候选范围</text><text x="887" y="213" class="muted sub">创建者</text><text x="1054" y="213" class="muted sub">版本 / 更新时间</text><text x="1304" y="213" class="muted sub">操作</text>
  <rect x="344" y="230" width="1046" height="92" class="panel"/><text x="366" y="263" class="txt h">当前设备 · 拟真</text><text x="366" y="289" class="mono">alias: current-device</text><text x="655" y="265" class="txt body">固定 4 条 · deviceMatch · inline</text><text x="655" y="290" class="muted sub">planId: 66BEC501…</text><text x="887" y="265" class="txt body">00008110…801E</text><text x="887" y="290" class="muted sub">设备创建</text><text x="1054" y="265" class="txt body">r3</text><text x="1054" y="290" class="muted sub">刚刚更新</text><rect x="1262" y="251" width="50" height="28" rx="5" class="soft"/><text x="1287" y="270" text-anchor="middle" class="txt sub">编辑</text><rect x="1320" y="251" width="50" height="28" rx="5" fill="#fff0f0"/><text x="1345" y="270" text-anchor="middle" class="red sub">删除</text>
  <rect x="344" y="322" width="1046" height="92" class="panel"/><text x="366" y="355" class="txt h">旧版设备兼容</text><text x="366" y="381" class="mono">alias: legacy</text><text x="655" y="357" class="txt body">固定 3 条 · random · profile</text><text x="887" y="357" class="txt body">00008120…801E</text><text x="1054" y="357" class="txt body">r1</text><rect x="1262" y="343" width="50" height="28" rx="5" class="soft"/><text x="1287" y="362" text-anchor="middle" class="txt sub">查看</text><rect x="1320" y="343" width="50" height="28" rx="5" class="soft"/><text x="1345" y="362" text-anchor="middle" class="txt sub">管理</text>
  <rect x="344" y="438" width="1046" height="184" rx="8" class="panel"/><text x="366" y="470" class="txt h">创建回放计划</text><text x="366" y="496" class="muted sub">由当前手势组固定 target，后台创建会记录 admin-web 审计；保存后 revision 推进，客户端下次同步可见。</text>
  <text x="366" y="536" class="txt body">名称</text><rect x="366" y="548" width="292" height="36" rx="5" class="panel"/><text x="379" y="572" class="muted sub">例如：当前设备 · 拟真</text><text x="680" y="536" class="txt body">Alias（可空，同组唯一）</text><rect x="680" y="548" width="292" height="36" rx="5" class="panel"/><text x="693" y="572" class="muted sub">例如：current-device</text><text x="994" y="536" class="txt body">选择策略</text><rect x="994" y="548" width="188" height="36" rx="5" class="panel"/><text x="1008" y="572" class="txt sub">随机 ▾</text><text x="1204" y="536" class="txt body">回放配置</text><rect x="1204" y="548" width="166" height="36" rx="5" class="panel"/><text x="1218" y="572" class="txt sub">default ▾</text>
  <rect x="1128" y="638" width="112" height="36" rx="6" class="soft"/><text x="1184" y="661" text-anchor="middle" class="txt body">取消</text><rect x="1252" y="638" width="118" height="36" rx="6" class="blue"/><text x="1311" y="661" text-anchor="middle" class="white body">创建并同步</text>
  <rect x="344" y="708" width="1046" height="132" rx="8" class="soft"/><text x="366" y="740" class="txt h">交互规则</text><text x="366" y="768" class="muted body">设备创建的自定义方案：创建者设备可编辑/删除。管理端：可查看、编辑、删除和创建，所有越权操作写入审计。</text><text x="366" y="796" class="muted body">默认方案是持久化方案，有正常 planId 并显示在列表中；它不可编辑或删除。创建成功后服务端返回 revision，客户端必须重新同步 Snapshot。</text>
</svg>
