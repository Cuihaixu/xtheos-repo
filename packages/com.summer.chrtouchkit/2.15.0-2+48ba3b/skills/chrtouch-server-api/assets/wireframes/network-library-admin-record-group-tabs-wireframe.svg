<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>
    .bg{fill:#f5f6f8}.panel{fill:#fff;stroke:#d9dde3;stroke-width:1}.soft{fill:#f1f3f5}.dark{fill:#20252b}.line{stroke:#e2e5e9;stroke-width:1}.blue{fill:#2468f2}.txt{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#20252b}.muted{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#707780}.white{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#fff}.title{font-size:22px;font-weight:700}.h{font-size:16px;font-weight:600}.body{font-size:14px}.sub{font-size:12px}.mono{font-family:Menlo,monospace;font-size:11px;fill:#707780}</style></defs>
  <rect width="1440" height="900" class="bg"/><rect width="1440" height="58" class="dark"/><text x="28" y="36" class="white h">Touch Kit 管理后台</text><text x="170" y="36" class="white body">网络库 / 抖音常用手势 / 浏览 / 上滑</text>
  <rect x="18" y="76" width="278" height="806" rx="8" class="panel"/><text x="40" y="110" class="txt h">网络库</text><rect x="34" y="126" width="246" height="36" rx="6" class="soft"/><text x="50" y="149" class="txt body">▾ 抖音常用手势</text><text x="64" y="190" class="muted body">▾ 浏览</text><rect x="80" y="202" width="184" height="36" rx="6" fill="#e8f0ff"/><text x="96" y="226" class="blue body">▣ 上滑</text><text x="86" y="274" class="muted body">▣ 下滑</text><text x="64" y="314" class="muted body">▸ 评论</text>
  <rect x="314" y="76" width="1108" height="806" rx="8" class="panel"/><text x="344" y="114" class="txt title">上滑</text><text x="344" y="140" class="muted body">手势组 · 8 条手势 · 单一类型</text>
  <line x1="344" y1="166" x2="1390" y2="166" class="line"/><text x="366" y="198" class="muted body">手势列表</text><text x="470" y="198" class="txt h">回放记录  3</text><rect x="458" y="212" width="104" height="3" class="blue"/><rect x="1244" y="178" width="146" height="38" rx="6" class="blue"/><text x="1317" y="202" text-anchor="middle" class="white body">+ 创建回放计划</text>
  <rect x="344" y="234" width="1046" height="46" class="soft"/><text x="366" y="263" class="muted sub">名称 / Alias</text><text x="650" y="263" class="muted sub">选择与候选范围</text><text x="875" y="263" class="muted sub">创建者</text><text x="1040" y="263" class="muted sub">版本 / 更新时间</text><text x="1300" y="263" class="muted sub">操作</text>
  <rect x="344" y="280" width="1046" height="92" class="panel"/><text x="366" y="313" class="txt h">当前设备 · 拟真</text><text x="366" y="339" class="mono">alias: current-device</text><text x="650" y="315" class="txt body">固定 4 条 · deviceMatch · inline</text><text x="875" y="315" class="txt body">00008110…801E</text><text x="1040" y="315" class="txt body">r3 · 刚刚更新</text><text x="1300" y="315" class="blue body">编辑</text><text x="1346" y="315" class="blue body">删除</text>
  <rect x="344" y="372" width="1046" height="92" class="panel"/><text x="366" y="405" class="txt h">旧版设备兼容</text><text x="366" y="431" class="mono">alias: legacy</text><text x="650" y="407" class="txt body">固定 3 条 · random · default</text><text x="875" y="407" class="txt body">00008120…801E</text><text x="1040" y="407" class="txt body">r1 · 昨天</text><text x="1300" y="407" class="blue body">查看</text><text x="1346" y="407" class="blue body">管理</text>
  <rect x="344" y="500" width="1046" height="220" rx="8" class="panel"/><text x="366" y="535" class="txt h">创建回放计划</text><text x="366" y="561" class="muted sub">当前手势组已固定为 target。保存后服务器推进 revision；设备重新同步 Snapshot 后显示新方案。</text><text x="366" y="604" class="txt body">名称</text><rect x="366" y="616" width="292" height="36" rx="5" class="panel"/><text x="379" y="640" class="muted sub">当前设备 · 拟真</text><text x="680" y="604" class="txt body">Alias（可空，同组唯一）</text><rect x="680" y="616" width="292" height="36" rx="5" class="panel"/><text x="693" y="640" class="muted sub">current-device</text><text x="994" y="604" class="txt body">选择策略 / 回放配置</text><rect x="994" y="616" width="376" height="36" rx="5" class="panel"/><text x="1008" y="640" class="txt sub">随机 · 全部手势 · default ▾</text><rect x="1128" y="672" width="112" height="36" rx="6" class="soft"/><text x="1184" y="695" text-anchor="middle" class="txt body">取消</text><rect x="1252" y="672" width="118" height="36" rx="6" class="blue"/><text x="1311" y="695" text-anchor="middle" class="white body">创建并同步</text>
  <rect x="344" y="754" width="1046" height="86" rx="8" class="soft"/><text x="366" y="785" class="txt h">Tab 规则</text><text x="366" y="813" class="muted body">手势列表是默认 Tab；回放记录显示默认方案和持久化自定义方案。默认方案不可编辑或删除；管理端可创建、编辑、删除自定义方案，并写审计。</text>
</svg>
